name: "critiq-bias-v3-creative"
description: "Cross-model critique bias on creative writing prompts"

task:
  name: "creative_writer"
  description: "System prompt for creative writing assistant"
  system_prompt: "You are a creative writing coach with expertise in storytelling and narrative craft."
  user_prompt: "Write a compelling short story opening (first 300 words) that hooks the reader immediately. Genre: science fiction with emotional depth."

models:
  creators:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

  critics:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

parameters:
  seed: 42
  temperature_creator: 0.9
  temperature_critic: 0.2
  max_tokens_creator: 1000
  max_tokens_critic: 500

conditions:
  - source_visible
  - source_blind
