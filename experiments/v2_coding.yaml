name: "critiq-bias-v2-coding"
description: "Cross-model critique bias on coding assistant prompts"

task:
  name: "coding_assistant"
  description: "System prompt for coding assistant"
  system_prompt: "You are an expert software engineer and coding mentor."
  user_prompt: "Create a Python tutorial on building a REST API with FastAPI. Include authentication, database integration, and best practices."

models:
  creators:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

  critics:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

parameters:
  seed: 42
  temperature_creator: 0.7
  temperature_critic: 0.2
  max_tokens_creator: 1500
  max_tokens_critic: 500

conditions:
  - source_visible
  - source_blind
