name: "critiq-bias-v4-reasoning"
description: "Cross-model critique bias on logical reasoning prompts"

task:
  name: "logical_reasoner"
  description: "System prompt for logical reasoning assistant"
  system_prompt: "You are an expert in logic, critical thinking, and problem-solving."
  user_prompt: "Explain the logical fallacy of 'false dichotomy' with 3 real-world examples and how to avoid it in arguments."

models:
  creators:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

  critics:
    - provider: openai
      model_name: gpt-4o
    - provider: anthropic
      model_name: claude-3.5-sonnet
    - provider: google
      model_name: gemini-2.0-flash-exp

parameters:
  seed: 42
  temperature_creator: 0.5
  temperature_critic: 0.2
  max_tokens_creator: 1000
  max_tokens_critic: 500

conditions:
  - source_visible
  - source_blind
